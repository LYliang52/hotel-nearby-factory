<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>出差小助手 · 厂家周边酒店</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="banner" class="banner hidden"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">出差</span>
        <span class="brand-text">厂家周边酒店</span>
      </div>

      <form id="searchForm" class="search-form" autocomplete="off">
        <label class="field field-wide">
          <span>目的地厂家</span>
          <input id="factory" name="factory" placeholder="公司名 / 工厂名 / 详细地址" />
        </label>
        <label class="field">
          <span>城市</span>
          <input id="city" name="city" placeholder="选填" />
        </label>
        <label class="field">
          <span>出发地</span>
          <input id="from" name="from" placeholder="如 上海" />
        </label>
        <label class="field field-num">
          <span>半径 km</span>
          <input id="radiusKm" name="radiusKm" type="number" min="0.5" max="50" step="0.5" value="10" />
        </label>
        <label class="field field-num">
          <span>价格下限</span>
          <input id="priceMin" name="priceMin" type="number" min="0" step="50" value="300" />
        </label>
        <label class="field field-num">
          <span>价格上限</span>
          <input id="priceMax" name="priceMax" type="number" min="0" step="50" value="600" />
        </label>
        <button type="submit" id="submitBtn" class="primary">查酒店</button>
      </form>
    </header>

    <main class="layout">
      <section class="map-wrap">
        <div id="map"></div>
        <div class="map-overlay" id="mapOverlay">
          <div class="legend">
            <div class="legend-title">图例</div>
            <div class="legend-row"><i class="dot brand"></i>常住品牌（希尔顿/假日/温德姆/全季/亚朵）</div>
            <div class="legend-row"><i class="dot r1"></i>很近 · <i class="dot r3"></i>中等 · <i class="dot r5"></i>边缘</div>
            <div class="legend-row"><i class="dot pin"></i>目的地厂家</div>
          </div>
        </div>
        <div class="map-tools">
          <button type="button" data-zoom="fit" title="缩放到全部结果">⤢ 全览</button>
          <button type="button" data-zoom="factory" title="回到厂家">◎ 厂家</button>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-head">
          <div id="summary" class="summary">
            <div class="summary-empty">
              <strong>填个厂家名，开始查</strong>
              <p>先在地图上把目的地厂家定位出来，再按半径、价格、品牌把周边酒店标在一张图上。</p>
              <button type="button" id="demoBtn" class="ghost">先看演示效果</button>
            </div>
          </div>
        </div>

        <div class="actions-top">
          <div class="live-bar hidden" id="liveBar">
            <span class="live-bar-label">携程查价日期</span>
            <input type="date" id="liveCheckin" />
            <span class="live-bar-sep">→</span>
            <input type="date" id="liveCheckout" />
            <span class="live-bar-hint" id="liveNight"></span>
          </div>

          <div class="panel-foot">
            <button type="button" id="ctripLoginBtn" class="ghost" title="弹出一个 Chrome 窗口扫码登录携程，登录一次后实时价才可用">登录携程</button>
            <button type="button" id="livePriceBtn" class="cta" disabled title="用登录好的携程账号查周边实时房价，约 50 秒">携程实时价</button>
            <button type="button" id="openTabsBtn" class="ghost" disabled title="一次打开几家酒店的携程页面，你自己看一眼再补录">批量核价</button>
            <button type="button" id="exportBtn" class="ghost" disabled>导出 CSV</button>
            <span class="hint">实时价来自携程，是列表页「起价」；下单前请再核对。</span>
          </div>
        </div>

        <div id="travel" class="travel"></div>

        <div id="candidates" class="candidates hidden"></div>

        <div id="filters" class="filters hidden">
          <div class="filter-row">
            <span class="filter-label">排序</span>
            <div class="segmented" id="sortGroup">
              <button type="button" data-sort="score" class="active">综合推荐</button>
              <button type="button" data-sort="distance">距离最近</button>
              <button type="button" data-sort="price">价格最低</button>
              <button type="button" data-sort="rating">评分最高</button>
            </div>
          </div>
          <div class="filter-row">
            <span class="filter-label">筛选</span>
            <div class="chips" id="filterGroup">
              <label class="chip"><input type="checkbox" data-filter="tier1" /> 常住品牌</label>
              <label class="chip"><input type="checkbox" data-filter="budget" /> 预算内</label>
              <label class="chip"><input type="checkbox" data-filter="withPrice" /> 已报价</label>
              <label class="chip"><input type="checkbox" data-filter="lodging" /> 含民宿</label>
            </div>
          </div>
        </div>

        <div id="list" class="list"></div>
      </aside>
    </main>

    <div id="toast" class="toast hidden"></div>

    <div id="liveDialog" class="dialog hidden">
      <div class="dialog-card dialog-wide">
        <h3 id="liveTitle">携程实时价</h3>
        <p class="dialog-sub" id="liveSub"></p>
        <div class="live-list" id="liveList"></div>
        <div class="dialog-actions">
          <button type="button" class="ghost" id="liveCancel">取消</button>
          <button type="button" class="primary" id="liveSave">写入</button>
        </div>
      </div>
    </div>

    <div id="priceDialog" class="dialog hidden">
      <div class="dialog-card">
        <h3 id="priceDialogTitle">补录房价</h3>
        <p class="dialog-sub">填你刚在携程上看到的当日最低价，会存到本地 data/prices.json</p>
        <label class="field"><span>价格（元/晚）</span><input id="priceInput" type="number" min="1" step="1" /></label>
        <label class="field"><span>来源</span>
          <select id="priceSource">
            <option>携程</option>
            <option>前台询价</option>
          </select>
        </label>
        <label class="field"><span>备注</span><input id="priceNote" placeholder="如 含早 / 无窗 / 会员价" /></label>
        <div class="dialog-actions">
          <button type="button" class="ghost" id="priceCancel">取消</button>
          <button type="button" class="primary" id="priceSave">保存</button>
        </div>
      </div>
    </div>

    <div id="qrDialog" class="dialog hidden">
      <div class="dialog-card">
        <h3>登录携程</h3>
        <p class="dialog-sub">用携程 App 或微信扫下面的二维码登录，扫完稍等自动完成</p>
        <div class="qr-box">
          <div id="qrPlaceholder" class="qr-placeholder">正在打开登录页…</div>
          <img id="qrImg" class="hidden" alt="携程登录二维码" />
        </div>
        <div class="dialog-actions">
          <button type="button" class="ghost" id="qrRefresh">刷新二维码</button>
          <button type="button" class="primary" id="qrCancel">取消</button>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
